apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app-deployment
  namespace: test-cluster-namespace
  labels:
    app: voting-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: voting-app

  template:
    metadata:
      labels:
        app: voting-app

    spec:
      containers:
      - name: voting-container
        image: voting-application:votingapp-${{ github.run_id }}
        imagePullPolicy: Always

        ports:
        - containerPort: 80