apiVersion: apps/v1
kind: Deployment
metadata:
  name: results-app-deployment
  namespace: test-cluster-namespace
  labels:
    app: results-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: results-app

  template:
    metadata:
      labels:
        app: results-app

    spec:
      containers:
      - name: results-container
        image: jayanta/voting-application:resultapp-${{ github.run_id }}
        imagePullPolicy: Always

        ports:
        - containerPort: 80