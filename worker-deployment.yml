apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-app-deployment
  namespace: test-cluster-namespace
  labels:
    app: worker-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: worker-app

  template:
    metadata:
      labels:
        app: worker-app

    spec:
      containers:
      - name: worker-container
        image: jayanta/voting-application:workerapp-${{ github.run_id }}
        imagePullPolicy: Always